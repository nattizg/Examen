<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requisitos y Licitacion</title>
</head>
<body>
    <header>
        <h1>Requisitos y Licitacion B2B</h1>
    </header>
    <nav>
  <ul>
    <li><a href="index.html">Index</a></li>
    <li><a href="Catalogo.html">Catalogo</a></li>
    <li><a href="#Ofertas">Ofertas del mes</a></li>
    <li><a href="Cotizaciones.html">Cotizaciones</a></li>
    <li><a href="#Contacto">Contacto</a></li>
    <li><a href="Credito.html">Credito</a></li>
  </ul>
  <button type="submit">Cotizar por Whatsapp</button>
  </nav>
  <fieldset>
    <form>
        <label for="empresa">Nombre de la Empresa o Contratista Solicitante: </label>
        <input type="text" id="empresa" name="empresa" placeholder="Ej. Corporación Textil S.A." minlength="5" maxlength="150" required>
        <label for="rtn">RTN: </label>
        <input type="text" id="rtn" name="rtn" pattern="[0-9]{14}" placeholder="08012007204980" min="14" maxlength="14" required>
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="correo@dominio.com"  required> 
        <label for="telefono">Teléfono de Contacto:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+504 0000-0000" pattern="[0-9]{4}-[0-9]{4}" required>

        <label for="depto">Departamento de entrega</label>
        <select id="depto" name="depto" required>
        <option value="" disabled selected></option>
        <option value="Cortes">Cortes</option>
        <option value="Francisco Morazan">Francisco Morazan</option>
        <option value="Choluteca">Choluteca</option>
        <option value="Comayagua">Comayagua</option>
        <option value="Olancho">OLancho</option>

        <label for="Terminos">
        <input type="checkbox" id="terminos" name="terminos" value="terminos" required> 
        Acepto los terminos de garantia tecnica y cotizacion
        </label>

        <button type="submit">Enviar Formulario</button>
        <button type="reset">Limpiar Formulario</button>
    </fieldset>
</html>
